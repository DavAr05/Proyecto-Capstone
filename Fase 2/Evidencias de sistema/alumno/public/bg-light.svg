<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 860" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F7FF"/>
      <stop offset="1" stop-color="#E9EFFF"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C7D6FF" stop-opacity=".85"/>
      <stop offset="1" stop-color="#DCE6FF" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCE7A9" stop-opacity=".95"/>
      <stop offset="1" stop-color="#FBEFC8" stop-opacity=".6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="860" fill="url(#base)"/>
  <!-- arriba: arco azul grande y arco dorado -->
  <path d="M170 0 C 230 70 330 90 400 60 L 400 0 Z" fill="url(#blue)"/>
  <circle cx="352" cy="-34" r="150" fill="url(#blue)" opacity=".55"/>
  <path d="M250 0 C 290 22 340 24 392 4 L 392 0 Z" fill="url(#gold)"/>
  <circle cx="318" cy="-58" r="96" fill="url(#gold)" opacity=".8"/>
  <!-- abajo: formas doradas y azules -->
  <path d="M0 690 C 60 668 120 700 170 770 L 170 860 L 0 860 Z" fill="url(#gold)"/>
  <circle cx="-10" cy="760" r="120" fill="url(#gold)" opacity=".55"/>
  <path d="M400 700 C 330 700 270 760 230 860 L 400 860 Z" fill="url(#blue)"/>
  <circle cx="420" cy="800" r="140" fill="url(#blue)" opacity=".5"/>
</svg>
